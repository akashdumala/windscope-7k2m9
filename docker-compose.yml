
services:
  backend:
    build:
      context: ./backend
    container_name: windscope-backend
    ports:
      - "5000:5000"
    environment:
      FRONTEND_URL: http://localhost:5173
      FLASK_DEBUG: "false"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: windscope-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
